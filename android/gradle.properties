# Tooling baseline per docs/android.md, "Tooling". The JDK 17 toolchain lives in
# app/build.gradle.kts and must stay in step with the java-version in the CI
# android job (.github/workflows/ci.yml).
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# The stack is all AndroidX (docs/android.md, "Tech"); Jetifier stays off.
android.useAndroidX=true

kotlin.code.style=official

# App versioning — the one place a build is bumped (issue #135); read by
# app/build.gradle.kts into defaultConfig.versionCode/versionName.
recally.versionCode=2
recally.versionName=0.2.3

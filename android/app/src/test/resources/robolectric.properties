# Global Robolectric config for JVM unit tests.
#
# isIncludeAndroidResources=true (needed by the Compose UI tests for the
# ui-test-manifest ComponentActivity) makes Robolectric honour the merged
# manifest, which names RecallyApplication. Its Hilt graph builds the
# AndroidKeyStore cipher during field injection in onCreate, and
# AndroidKeyStore does not exist off-device — so every Robolectric test would
# crash before reaching its own code. Unit tests never need the real
# application (they fake repositories/ciphers), so they get a plain
# android.app.Application, matching what legacy manifest resolution gave them.
application=android.app.Application

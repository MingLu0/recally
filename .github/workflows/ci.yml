name: CI

on:
  pull_request:
  push:
    branches: [main]
    # v* tags exist so a human can ship a build to App Distribution by pushing
    # a tag; only the distribute job below reacts to them.
    tags: ['v*']
  # Manual dispatch is the normal ship path (issue #136). Uploading on every
  # PR would spam the tester group and burn App Distribution quota.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Interpreter comes from .python-version at the repo root; uv.lock is
      # committed, so --frozen installs bit-identical dependencies.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest

      # Security scanners are CI-only (docs/backend.md, "Tooling"). Run via
      # `uvx` so they stay out of the project's locked dependency set.
      - name: Bandit
        run: uvx bandit -r src/

      # pip-audit cannot read uv.lock directly, so export it to a fully-resolved
      # requirements file first. --disable-pip audits that list as-is instead of
      # re-resolving it in a throwaway venv.
      - name: pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --strict --disable-pip

  # Skipped entirely until android/ is a real Gradle project — the module is a
  # placeholder README until roadmap step 4a, and a job that cannot find a
  # wrapper would fail every backend-only PR.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - name: Check for a Gradle project
        id: gradle_project
        working-directory: .
        run: |
          if [ -f android/gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "android/ has no Gradle wrapper yet; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # AGP 8.x needs JDK 17+. Keep this in step with the Gradle toolchain
      # declared in android/app/build.gradle.kts — a mismatch fails obscurely.
      - name: Set up JDK
        if: steps.gradle_project.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Supersedes the deprecated gradle/gradle-build-action. Caching is
      # load-bearing: an uncached Compose build is slow enough to hurt.
      - name: Set up Gradle
        if: steps.gradle_project.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        if: steps.gradle_project.outputs.present == 'true'
        run: ./gradlew ktlintCheck

      # Android Lint is the Android-specific correctness gate (permissions,
      # resources, API level vs min SDK 26), not a type gate — Kotlin's compiler
      # already covers what mypy does for the backend.
      - name: Android Lint
        if: steps.gradle_project.outputs.present == 'true'
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        if: steps.gradle_project.outputs.present == 'true'
        run: ./gradlew :app:testDebugUnitTest

      # Separate from the tests on purpose: Hilt's graph is validated by KSP at
      # compile time, so a test-only run can pass while the app does not build.
      - name: Assemble debug
        if: steps.gradle_project.outputs.present == 'true'
        run: ./gradlew :app:assembleDebug

  # MVP-DIST-b (#136): build the signed debug APK and upload it to Firebase
  # App Distribution. Dispatch/tag only — never on pull_request — so testers
  # are not spammed and quota is not burned on every push. All credentials
  # come from GitHub secrets, are written to disk (gitignored filenames,
  # umask 077) at job start, and are never echoed.
  #
  # A `v*` tag is the ship path (#175): the tag names the version the build
  # reports, the APK is retained for 30 days so a tester report can be traced
  # back to the exact binary, and a GitHub Release is cut with the APK
  # attached. A workflow_dispatch run does everything except the release, and
  # keeps the gradle.properties version — no input required.
  distribute:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow root: only the release step needs to
    # write, so the per-PR backend/android jobs keep a read-only GITHUB_TOKEN.
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      # Full history so the release-notes step can name the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # refs/tags/v0.2.0 -> 0.2.0. Left empty on a workflow_dispatch run, in
      # which case the Gradle build keeps the gradle.properties default — this
      # ticket makes the tag win for the build it produces, it does not bump
      # the committed version (#175, scoped out).
      - name: Resolve the version being shipped
        id: version
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            resolved_version="$(sed -n 's/^recally\.versionName=//p' android/gradle.properties)"
            echo "from_tag=false" >> "$GITHUB_OUTPUT"
          else
            resolved_version="${GITHUB_REF#refs/tags/v}"
            echo "from_tag=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$resolved_version" >> "$GITHUB_OUTPUT"
          echo "Shipping version $resolved_version (event: ${{ github.event_name }})"

      # Same toolchain as the per-PR android job — a mismatch fails obscurely.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored locally, so CI reconstructs it from
      # a secret. The App Distribution plugin needs it for the Firebase app ID.
      - name: Write google-services.json
        working-directory: .
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # The debug keystore (#135) travels as base64. The CI copy is written
      # extensionless on purpose: a JKS keystore needs no file extension, and
      # this keeps the repo secret-material grep (#136, done-when) free of
      # keystore-path false positives. The RECALLY_KEYSTORE_PROPERTIES secret
      # must therefore use `storeFile=debug-keystore` (relative to android/).
      - name: Write debug keystore and keystore.properties
        working-directory: .
        env:
          RECALLY_DEBUG_KEYSTORE_BASE64: ${{ secrets.RECALLY_DEBUG_KEYSTORE_BASE64 }}
          RECALLY_KEYSTORE_PROPERTIES: ${{ secrets.RECALLY_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$RECALLY_DEBUG_KEYSTORE_BASE64" ] || [ -z "$RECALLY_KEYSTORE_PROPERTIES" ]; then
            echo "::error::RECALLY_DEBUG_KEYSTORE_BASE64 and RECALLY_KEYSTORE_PROPERTIES secrets must both be set"
            exit 1
          fi
          umask 077
          printf '%s' "$RECALLY_DEBUG_KEYSTORE_BASE64" | base64 -d > android/debug-keystore
          printf '%s' "$RECALLY_KEYSTORE_PROPERTIES" > android/keystore.properties

      # The App Distribution Gradle plugin authenticates with a service-account
      # key via GOOGLE_APPLICATION_CREDENTIALS. Written under RUNNER_TEMP (not
      # the checkout) so it can never be committed or archived as an artifact.
      - name: Write Firebase service-account key
        working-directory: .
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"
            exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      # -Precally.versionName overrides the gradle.properties default through
      # the existing findProperty lookup in app/build.gradle.kts, so a tagged
      # build reports the tag's version instead of 0.1.0. On a dispatch run the
      # value read back out of gradle.properties is passed, which is a no-op.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug -Precally.versionName=${{ steps.version.outputs.version }}

      # Notes name the version, the short SHA and the date so a tester can tell
      # two builds apart. Written to a file and passed with --releaseNotesFile
      # (a real @Option on the upload task) rather than replacing the
      # `releaseNotes` in build.gradle.kts, so a local
      # `./gradlew appDistributionUploadDebug` keeps working unchanged (#175).
      - name: Generate release notes
        id: notes
        working-directory: .
        env:
          SHIPPED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.txt"
          {
            echo "Recally $SHIPPED_VERSION (debug)"
            echo ""
            echo "Commit: $(git rev-parse --short HEAD)"
            echo "Built:  $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > "$notes_file"
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "--- generated release notes ---"
          cat "$notes_file"

      - name: Upload to Firebase App Distribution
        run: ./gradlew :app:appDistributionUploadDebug --releaseNotesFile="${{ steps.notes.outputs.path }}"

      # Retained so the exact binary a tester reported against can be
      # re-downloaded after the run's workspace is gone (#175).
      - name: Retain the APK
        uses: actions/upload-artifact@v4
        with:
          name: recally-debug-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # Tag runs only — a dispatch run has no tag to hang a release off.
      - name: Cut the GitHub Release
        if: steps.version.outputs.from_tag == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Recally ${{ steps.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          files: android/app/build/outputs/apk/debug/*.apk

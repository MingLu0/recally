<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; }
    a { color: #4fb894; } a:hover { color: #4fb894; }
  </style>
</helmet>

<div style="width: 560px; height: 1040px; background: #2a2d2b; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;">

  <div style="position: relative; width: 414px; height: 868px; background: #000000; border-radius: 56px; padding: 12px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(40,40,38,0.3), 0 4px 14px rgba(40,40,38,0.16);">
    <div style="width: 390px; height: 844px; background: #121413; border-radius: 44px; overflow: hidden; position: relative;">

      <!-- SCREEN CONTENT — no status bar drawn -->
      <div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #121413;">

        <div style="padding: 62px 20px 14px 20px; border-bottom: 1px solid #2c302e;">
          <span style="font-size: 22px; font-weight: 800; color: #ecefed; letter-spacing: -0.7px;">Stats</span>
        </div>

        <div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 16px;">

          <!-- headline figures -->
          <div style="background: #232725; border: 1px solid #2c302e; border-radius: 12px; display: flex;">
            <div style="flex-grow: 1; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-right: 1px solid #2c302e;">
              <span style="font-size: 21px; font-weight: 800; color: #e8975f; letter-spacing: -0.5px;">9</span>
              <span style="font-size: 12px; font-weight: 400; color: #8b928f;">day streak</span>
            </div>
            <div style="flex-grow: 1; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; border-right: 1px solid #2c302e;">
              <span style="font-size: 21px; font-weight: 800; color: #4fb894; letter-spacing: -0.5px;">23</span>
              <span style="font-size: 12px; font-weight: 400; color: #8b928f;">today</span>
            </div>
            <div style="flex-grow: 1; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 3px;">
              <span style="font-size: 21px; font-weight: 800; color: #4fc78f; letter-spacing: -0.5px;">87%</span>
              <span style="font-size: 12px; font-weight: 400; color: #8b928f;">retention 30d</span>
            </div>
          </div>

          <!-- forecast -->
          <div style="display: flex; flex-direction: column; gap: 11px;">
            <div style="display: flex; align-items: baseline; justify-content: space-between;">
              <span style="font-size: 15px; font-weight: 800; color: #ecefed; letter-spacing: -0.4px;">Coming due</span>
              <span style="font-size: 12px; font-weight: 500; color: #8b928f;">next 7 days</span>
            </div>
            <div style="background: #232725; border: 1px solid #2c302e; border-radius: 12px; padding: 16px 14px 12px 14px; display: flex; flex-direction: column; gap: 10px;">
              <div style="height: 108px; display: flex; align-items: flex-end; gap: 7px;">
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #4fb894;">14</span>
                  <div style="width: 100%; height: 78px; background: #4fb894; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">9</span>
                  <div style="width: 100%; height: 50px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">17</span>
                  <div style="width: 100%; height: 94px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">6</span>
                  <div style="width: 100%; height: 33px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">11</span>
                  <div style="width: 100%; height: 61px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">4</span>
                  <div style="width: 100%; height: 22px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
                <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
                  <span style="font-size: 11px; font-weight: 700; color: #8b928f;">13</span>
                  <div style="width: 100%; height: 72px; background: #2b4a40; border-radius: 5px 5px 0 0;"></div>
                </div>
              </div>
              <div style="display: flex; gap: 7px; border-top: 1px solid #2c302e; padding-top: 8px;">
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 600; color: #ecefed;">Today</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Tue</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Wed</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Thu</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Fri</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Sat</span>
                <span style="flex-grow: 1; text-align: center; font-size: 11px; font-weight: 400; color: #8b928f;">Sun</span>
              </div>
            </div>
          </div>

          <!-- lapse rate by card type -->
          <div style="display: flex; flex-direction: column; gap: 11px;">
            <div style="display: flex; align-items: baseline; justify-content: space-between;">
              <span style="font-size: 15px; font-weight: 800; color: #ecefed; letter-spacing: -0.4px;">Lapse rate</span>
              <span style="font-size: 12px; font-weight: 500; color: #8b928f;">by card type</span>
            </div>
            <div style="background: #232725; border: 1px solid #2c302e; border-radius: 12px; padding: 15px 14px; display: flex; flex-direction: column; gap: 14px;">
              <div style="display: flex; flex-direction: column; gap: 7px;">
                <div style="display: flex; align-items: baseline; justify-content: space-between;">
                  <span style="font-size: 14px; font-weight: 600; color: #ecefed;">Q&amp;A</span>
                  <span style="font-size: 15px; font-weight: 800; color: #4fc78f; letter-spacing: -0.3px;">11%</span>
                </div>
                <div style="height: 7px; background: #2c302e; border-radius: 5px; overflow: hidden; display: flex;">
                  <div style="width: 11%; background: #4fc78f; border-radius: 5px;"></div>
                </div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 7px;">
                <div style="display: flex; align-items: baseline; justify-content: space-between;">
                  <span style="font-size: 14px; font-weight: 600; color: #ecefed;">Cloze</span>
                  <span style="font-size: 15px; font-weight: 800; color: #e8975f; letter-spacing: -0.3px;">18%</span>
                </div>
                <div style="height: 7px; background: #2c302e; border-radius: 5px; overflow: hidden; display: flex;">
                  <div style="width: 18%; background: #e8975f; border-radius: 5px;"></div>
                </div>
              </div>
              <span style="font-size: 12px; line-height: 18px; font-weight: 400; color: #8b928f; border-top: 1px solid #2c302e; padding-top: 11px;">Cloze cards lapse more often. Worth watching if the gap widens.</span>
            </div>
          </div>

        </div>

        <!-- bottom nav -->
        <div style="margin-top: auto; background: #121413; border-top: 1px solid #2c302e; padding: 9px 12px 24px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8b928f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </div>
            <span style="font-size: 12px; font-weight: 500; color: #8b928f;">Today</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8b928f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            </div>
            <span style="font-size: 12px; font-weight: 500; color: #8b928f;">Decks</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; border-radius: 17px; background: #4fb894; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121413" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            </div>
            <span style="font-size: 12px; font-weight: 700; color: #4fb894;">Stats</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8b928f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <span style="font-size: 12px; font-weight: 500; color: #8b928f;">Settings</span>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

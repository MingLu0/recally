              <span style="font-size: 14px; font-weight: 800; color: #121413;">E</span>

            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px;">
              <div style="display: flex; flex-direction: column; gap: 2px;">

                <span style="font-size: 13px; font-weight: 400; color: #8b928f;">48 cards &middot; 9 chapters</span>

                <div style="border-radius: 5px; background: #153a30; padding: 2px 7px;">
                  <span style="font-size: 11px; font-weight: 700; color: #4fb894; letter-spacing: 0.3px;">6 DUE</span>

              <span style="font-size: 12px; font-weight: 400; color: #8b928f;">Or use the watched folder on your Mac</span>

            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">

            </div>

        </div>

      </div>
    </div>
  </div>

</div>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Outfit', system-ui, sans-serif; }
    a { color: #1f6feb; } a:hover { color: #1856b8; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #f4f6fb; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <!-- progress + streak -->
  <div style="padding: 22px 20px 16px 20px; display: flex; align-items: center; gap: 14px;">
    <div style="width: 36px; height: 36px; border-radius: 12px; background: #ffffff; border: 2px solid #dfe4ee; display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5b6478" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
    <div style="flex-grow: 1; height: 14px; background: #dfe4ee; border-radius: 7px; overflow: hidden; display: flex;">
      <div style="width: 58.3%; background: #16b364; border-radius: 7px;"></div>
    </div>
    <div style="font-size: 15px; font-weight: 800; color: #414c63; letter-spacing: -0.2px;">7<span style="color: #97a0b3;">/12</span></div>
  </div>

  <!-- big card -->
  <div style="flex-grow: 1; padding: 4px 20px 0 20px; display: flex; flex-direction: column; min-height: 0;">
    <div style="flex-grow: 1; background: #ffffff; border-radius: 28px; border: 3px solid #1b2436; box-shadow: 0 6px 0 #1b2436; padding: 26px 22px; display: flex; flex-direction: column; gap: 18px; min-height: 0;">

      <div style="display: flex; flex-direction: column; gap: 7px; align-items: flex-start;">
        <div style="background: #e8edff; border-radius: 10px; padding: 6px 11px;">
          <span style="font-size: 11px; font-weight: 700; color: #2f4bb8; letter-spacing: 0.3px;">CH 3 &middot; ERROR ANALYSIS</span>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #8a93a6; letter-spacing: 0.1px;">Evals for AI Engineers</div>
      </div>

      <div style="font-size: 26px; line-height: 33px; font-weight: 800; color: #0f1626; letter-spacing: -0.5px; text-wrap: pretty;">Why evaluate traces rather than individual steps?</div>

      <div style="display: flex; gap: 6px;">
        <div style="width: 26px; height: 5px; border-radius: 3px; background: #16b364;"></div>
        <div style="width: 8px; height: 5px; border-radius: 3px; background: #cdd5e4;"></div>
      </div>

      <div style="font-size: 18px; line-height: 27px; font-weight: 500; color: #414c63; text-wrap: pretty;">An LLM pipeline's behavior only makes sense end-to-end.</div>

    </div>
  </div>

  <!-- chunky rating buttons -->
  <div style="padding: 22px 20px 24px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px;">
    <div style="height: 68px; border-radius: 18px; background: #f04438; box-shadow: 0 4px 0 #a92b22; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 14px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px;">Again</span>
      <span style="font-size: 10px; font-weight: 600; color: #ffd7d3;">&lt;1m</span>
    </div>
    <div style="height: 68px; border-radius: 18px; background: #f79009; box-shadow: 0 4px 0 #b25e04; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 14px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px;">Hard</span>
      <span style="font-size: 10px; font-weight: 600; color: #ffe7c2;">10m</span>
    </div>
    <div style="height: 68px; border-radius: 18px; background: #16b364; box-shadow: 0 4px 0 #0d7d45; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 14px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px;">Good</span>
      <span style="font-size: 10px; font-weight: 600; color: #c5f3da;">4d</span>
    </div>
    <div style="height: 68px; border-radius: 18px; background: #1f6feb; box-shadow: 0 4px 0 #144da6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <span style="font-size: 14px; font-weight: 800; color: #ffffff; letter-spacing: 0.2px;">Easy</span>
      <span style="font-size: 10px; font-weight: 600; color: #cfe0fb;">9d</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

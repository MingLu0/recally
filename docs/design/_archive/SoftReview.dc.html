<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #5b8c3e; } a:hover { color: #47702f; }
  </style>
</helmet>

<div style="width: 560px; height: 1040px; background: #eef6e4; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;">

  <div style="position: absolute; left: -80px; top: 120px; width: 340px; height: 700px; background: #d4ea9f; border-radius: 200px; transform: rotate(-14deg);"></div>
  <div style="position: absolute; right: -110px; bottom: 60px; width: 300px; height: 560px; background: #dff0b8; border-radius: 180px; transform: rotate(12deg);"></div>

  <div style="position: relative; width: 414px; height: 868px; background: #14161a; border-radius: 56px; padding: 12px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(20,30,10,0.28), 0 4px 14px rgba(20,30,10,0.16);">
    <div style="width: 390px; height: 844px; background: #ffffff; border-radius: 44px; overflow: hidden; position: relative;">

      <!-- SCREEN CONTENT — no status bar drawn -->
      <div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #ffffff;">

        <!-- header: close + progress -->
        <div style="padding: 64px 22px 0 22px; display: flex; flex-direction: column; gap: 16px;">
          <div style="display: flex; align-items: center; gap: 14px;">
            <div style="width: 40px; height: 40px; border-radius: 20px; background: #f5f7f2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3d4a33" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
            <div style="flex-grow: 1; height: 10px; background: #eef1ea; border-radius: 5px; overflow: hidden; display: flex;">
              <div style="width: 58.3%; background: #8ab84f; border-radius: 5px;"></div>
            </div>
            <span style="font-size: 13px; font-weight: 700; color: #3d4a33; flex-shrink: 0;">7<span style="color: #9aa391;">/12</span></span>
          </div>
        </div>

        <!-- card -->
        <div style="flex-grow: 1; padding: 22px 22px 0 22px; display: flex; flex-direction: column; min-height: 0;">
          <div style="flex-grow: 1; background: #ffffff; border: 1px solid #eceee8; border-radius: 24px; padding: 24px 22px; display: flex; flex-direction: column; gap: 18px; min-height: 0; box-shadow: 0 2px 10px rgba(30,44,18,0.04);">

            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="width: 34px; height: 34px; border-radius: 17px; background: #eef6e4; border: 2px solid #8ab84f; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <span style="font-size: 13px; font-weight: 800; color: #5b8c3e;">E</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0;">
                <span style="font-size: 13px; font-weight: 700; color: #2b3524;">Evals for AI Engineers</span>
                <span style="font-size: 11px; font-weight: 500; color: #8c9682;">3. Error Analysis</span>
              </div>
            </div>

            <div style="font-size: 23px; line-height: 32px; font-weight: 700; color: #171f0f; letter-spacing: -0.5px; text-wrap: pretty;">Why evaluate traces rather than individual steps?</div>

            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="height: 1px; background: #f0f2ed; flex-grow: 1;"></div>
              <span style="font-size: 10px; font-weight: 700; color: #b3bbaa; letter-spacing: 1.4px;">ANSWER</span>
              <div style="height: 1px; background: #f0f2ed; flex-grow: 1;"></div>
            </div>

            <div style="background: #f6faf0; border-radius: 16px; padding: 18px 16px;">
              <div style="font-size: 17px; line-height: 27px; font-weight: 500; color: #3d4a33; text-wrap: pretty;">An LLM pipeline's behavior only makes sense end-to-end.</div>
            </div>

          </div>
        </div>

        <!-- rating: pastel tiles matching the action-tile language -->
        <div style="padding: 20px 22px 30px 22px; display: flex; flex-direction: column; gap: 12px;">
          <span style="font-size: 12px; font-weight: 600; color: #8c9682; text-align: center; letter-spacing: 0.1px;">How well did you know it?</span>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px;">
            <div style="height: 70px; border-radius: 18px; background: #fdeceb; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #b4392f;">Again</span>
              <span style="font-size: 10px; font-weight: 600; color: #cf8a83;">&lt;1m</span>
            </div>
            <div style="height: 70px; border-radius: 18px; background: #fdf3e3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #9a6b18;">Hard</span>
              <span style="font-size: 10px; font-weight: 600; color: #c4a267;">10m</span>
            </div>
            <div style="height: 70px; border-radius: 18px; background: #e9f4d7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #4a7a2e;">Good</span>
              <span style="font-size: 10px; font-weight: 600; color: #8aa872;">4d</span>
            </div>
            <div style="height: 70px; border-radius: 18px; background: #f0ebfa; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #6d55a8;">Easy</span>
              <span style="font-size: 10px; font-weight: 600; color: #a493c9;">9d</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

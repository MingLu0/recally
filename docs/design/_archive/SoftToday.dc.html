<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #5b8c3e; } a:hover { color: #47702f; }
  </style>
</helmet>

<!-- backdrop -->
<div style="width: 560px; height: 1040px; background: #eef6e4; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;">

  <div style="position: absolute; left: -80px; top: 120px; width: 340px; height: 700px; background: #d4ea9f; border-radius: 200px; transform: rotate(-14deg);"></div>
  <div style="position: absolute; right: -110px; bottom: 60px; width: 300px; height: 560px; background: #dff0b8; border-radius: 180px; transform: rotate(12deg);"></div>

  <!-- phone frame -->
  <div style="position: relative; width: 414px; height: 868px; background: #14161a; border-radius: 56px; padding: 12px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(20,30,10,0.28), 0 4px 14px rgba(20,30,10,0.16);">
    <div style="width: 390px; height: 844px; background: #ffffff; border-radius: 44px; overflow: hidden; position: relative;">

      <!-- SCREEN CONTENT — no status bar drawn; the OS renders its own here -->
      <div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #ffffff;">

        <!-- greeting -->
        <div style="padding: 68px 22px 0 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <div style="font-size: 27px; font-weight: 800; color: #171f0f; letter-spacing: -0.6px;">Good morning</div>
            <div style="font-size: 14px; font-weight: 500; color: #7a8570; letter-spacing: -0.1px;">12 cards are ready for you today</div>
          </div>
          <div style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #e6ebe0; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3d4a33" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          </div>
        </div>

        <!-- book row -->
        <div style="padding: 24px 22px 0 22px; display: flex; gap: 18px;">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: 62px; height: 62px; border-radius: 31px; background: #eef6e4; border: 2.5px solid #8ab84f; display: flex; align-items: center; justify-content: center;">
              <span style="font-family: 'Plus Jakarta Sans', serif; font-size: 21px; font-weight: 800; color: #5b8c3e;">E</span>
            </div>
            <span style="font-size: 12px; font-weight: 600; color: #3d4a33;">Evals</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: 62px; height: 62px; border-radius: 31px; background: #f2eefb; border: 2.5px solid #a48ed0; display: flex; align-items: center; justify-content: center;">
              <span style="font-size: 21px; font-weight: 800; color: #6d55a8;">A</span>
            </div>
            <span style="font-size: 12px; font-weight: 600; color: #3d4a33;">Agents</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
            <div style="width: 62px; height: 62px; border-radius: 31px; background: #f7f8f5; display: flex; align-items: center; justify-content: center;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8c9682" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <span style="font-size: 12px; font-weight: 600; color: #8c9682;">Import</span>
          </div>
        </div>

        <!-- two-up action tiles -->
        <div style="padding: 24px 22px 0 22px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px;">
          <div style="background: #e9f4d7; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; height: 108px; box-sizing: border-box;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4a7a2e" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 700; color: #2b4419;">Start review</span>
              <span style="font-size: 12px; font-weight: 500; color: #6b8354;">12 due &middot; 5 new</span>
            </div>
          </div>
          <div style="background: #f0ebfa; border-radius: 18px; padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; height: 108px; box-sizing: border-box;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6d55a8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
            <div style="display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 15px; font-weight: 700; color: #3c2d5e;">Approve</span>
              <span style="font-size: 12px; font-weight: 500; color: #7c69a5;">8 waiting</span>
            </div>
          </div>
        </div>

        <!-- streak / this week -->
        <div style="padding: 26px 22px 0 22px; display: flex; align-items: baseline; justify-content: space-between;">
          <span style="font-size: 19px; font-weight: 800; color: #171f0f; letter-spacing: -0.4px;">Your streak</span>
          <span style="font-size: 13px; font-weight: 600; color: #5b8c3e;">See all</span>
        </div>

        <div style="padding: 14px 22px 0 22px;">
          <div style="border: 1px solid #eceee8; border-radius: 20px; padding: 20px 18px 18px 18px; display: flex; flex-direction: column; gap: 16px;">

            <!-- arc gauge -->
            <div style="display: flex; align-items: center; justify-content: center; padding-top: 2px;">
              <div style="position: relative; width: 190px; height: 108px;">
                <svg width="190" height="108" viewBox="0 0 190 108" fill="none">
                  <path d="M18 100 A 77 77 0 1 1 172 100" stroke="#eef1ea" stroke-width="15" stroke-linecap="round" fill="none"></path>
                  <path d="M18 100 A 77 77 0 0 1 155 52" stroke="#8ab84f" stroke-width="15" stroke-linecap="round" fill="none"></path>
                  <circle cx="155" cy="52" r="9" fill="#6ea23a"></circle>
                  <circle cx="155" cy="52" r="3.5" fill="#ffffff"></circle>
                </svg>
                <div style="position: absolute; left: 0; top: 44px; width: 190px; display: flex; flex-direction: column; align-items: center; gap: 1px;">
                  <span style="font-size: 34px; font-weight: 800; color: #171f0f; letter-spacing: -1px; line-height: 38px;">9</span>
                  <span style="font-size: 13px; font-weight: 600; color: #7a8570;">days in a row</span>
                </div>
              </div>
            </div>

            <div style="height: 1px; background: #f0f2ed;"></div>

            <div style="display: flex; justify-content: space-between;">
              <div style="display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 11px; font-weight: 600; color: #8c9682; letter-spacing: 0.2px;">Reviewed today</span>
                <span style="font-size: 17px; font-weight: 800; color: #2b3524;">23</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 11px; font-weight: 600; color: #8c9682; letter-spacing: 0.2px;">Retention</span>
                <span style="font-size: 17px; font-weight: 800; color: #2b3524;">87%</span>
              </div>
              <div style="display: flex; flex-direction: column; gap: 3px;">
                <span style="font-size: 11px; font-weight: 600; color: #8c9682; letter-spacing: 0.2px;">Cards</span>
                <span style="font-size: 17px; font-weight: 800; color: #2b3524;">131</span>
              </div>
            </div>

          </div>
        </div>

        <!-- bottom nav -->
        <div style="margin-top: auto; border-top: 1px solid #f0f2ed; padding: 12px 14px 26px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#4a7a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            <span style="font-size: 11px; font-weight: 700; color: #4a7a2e;">Today</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9aa391" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <span style="font-size: 11px; font-weight: 600; color: #9aa391;">Decks</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9aa391" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            <span style="font-size: 11px; font-weight: 600; color: #9aa391;">Stats</span>
          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#9aa391" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            <span style="font-size: 11px; font-weight: 600; color: #9aa391;">Settings</span>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

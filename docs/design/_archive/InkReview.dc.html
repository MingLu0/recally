<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    a { color: #b4622a; } a:hover { color: #8f4d20; }
  </style>
</helmet>

<div style="width: 560px; height: 1040px; background: #f6efe4; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;">

  <div style="position: absolute; left: -70px; top: 90px; width: 320px; height: 720px; background: #eddfc8; border-radius: 200px; transform: rotate(-13deg);"></div>
  <div style="position: absolute; right: -100px; bottom: 40px; width: 290px; height: 580px; background: #f1e6d3; border-radius: 180px; transform: rotate(11deg);"></div>

  <div style="position: relative; width: 414px; height: 868px; background: #1a1714; border-radius: 56px; padding: 12px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(60,40,20,0.26), 0 4px 14px rgba(60,40,20,0.14);">
    <div style="width: 390px; height: 844px; background: #fffdf9; border-radius: 44px; overflow: hidden; position: relative;">

      <!-- SCREEN CONTENT — no status bar drawn -->
      <div style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #fffdf9;">

        <div style="padding: 64px 22px 0 22px; display: flex; align-items: center; gap: 14px;">
          <div style="width: 40px; height: 40px; border-radius: 20px; background: #f7f0e4; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4a4038" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </div>
          <div style="flex-grow: 1; height: 10px; background: #f2ebdd; border-radius: 5px; overflow: hidden; display: flex;">
            <div style="width: 58.3%; background: #d98b3a; border-radius: 5px;"></div>
          </div>
          <span style="font-size: 13px; font-weight: 700; color: #4a4038; flex-shrink: 0;">7<span style="color: #a89a86;">/12</span></span>
        </div>

        <!-- card: paper with a spine edge -->
        <div style="flex-grow: 1; padding: 22px 22px 0 22px; display: flex; flex-direction: column; min-height: 0;">
          <div style="flex-grow: 1; background: #ffffff; border: 1px solid #f0e7d8; border-left: 5px solid #b4622a; border-radius: 8px 22px 22px 8px; padding: 24px 22px; display: flex; flex-direction: column; gap: 18px; min-height: 0; box-shadow: 0 3px 12px rgba(90,60,30,0.06);">

            <div style="display: flex; flex-direction: column; gap: 3px;">
              <span style="font-size: 12px; font-weight: 700; color: #b4622a; letter-spacing: 0.3px;">Evals for AI Engineers</span>
              <span style="font-size: 11px; font-weight: 500; color: #a89a86;">3. Error Analysis</span>
            </div>

            <div style="font-family: 'Fraunces', Georgia, serif; font-size: 25px; line-height: 34px; font-weight: 600; color: #211c17; letter-spacing: -0.4px; text-wrap: pretty;">Why evaluate traces rather than individual steps?</div>

            <div style="display: flex; align-items: center; gap: 10px;">
              <div style="height: 1px; background: #f4ecdf; flex-grow: 1;"></div>
              <span style="font-size: 10px; font-weight: 700; color: #c4b6a1; letter-spacing: 1.4px;">ANSWER</span>
              <div style="height: 1px; background: #f4ecdf; flex-grow: 1;"></div>
            </div>

            <div style="background: #fdf7ee; border-radius: 14px; padding: 18px 16px;">
              <div style="font-size: 17px; line-height: 28px; font-weight: 400; color: #4a4038; text-wrap: pretty;">An LLM pipeline's behavior only makes sense end-to-end.</div>
            </div>

          </div>
        </div>

        <!-- rating -->
        <div style="padding: 20px 22px 30px 22px; display: flex; flex-direction: column; gap: 12px;">
          <span style="font-size: 12px; font-weight: 500; color: #a89a86; text-align: center; letter-spacing: 0.1px;">How well did you know it?</span>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px;">
            <div style="height: 70px; border-radius: 16px; background: #fdeee9; border: 1px solid #f5d9d0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #a8452c;">Again</span>
              <span style="font-size: 10px; font-weight: 600; color: #c99180;">&lt;1m</span>
            </div>
            <div style="height: 70px; border-radius: 16px; background: #fdf4e6; border: 1px solid #f3e2c4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #96631a;">Hard</span>
              <span style="font-size: 10px; font-weight: 600; color: #c3a675;">10m</span>
            </div>
            <div style="height: 70px; border-radius: 16px; background: #eef3ee; border: 1px solid #d8e4d8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #3f5f52;">Good</span>
              <span style="font-size: 10px; font-weight: 600; color: #8ba394;">4d</span>
            </div>
            <div style="height: 70px; border-radius: 16px; background: #211c17; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
              <span style="font-size: 14px; font-weight: 700; color: #f0b35f;">Easy</span>
              <span style="font-size: 10px; font-weight: 600; color: #9a8a76;">9d</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>

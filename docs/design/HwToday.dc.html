<!doctype html>
<html>

<body>
<x-dc>
<helmet>

<div style="width: 560px; height: 1040px; background: #ece7df; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; position: relative;">

    <div style="width: 390px; height: 844px; background: #fdf8f0; border-radius: 44px; overflow: hidden; position: relative;">

      <!-- SCREEN CONTENT — no status bar drawn -->

                <span style="font-size: 15px; font-weight: 700; color: #17181a;">Streak</span>
                <div style="display: flex; align-items: center; gap: 6px;">

              </div>

                  <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
                    <span style="font-size: 21px; font-weight: 800; color: #0b63f6; letter-spacing: -0.6px;">142</span>
                    <span style="font-size: 12px; font-weight: 400; color: #9b948a;">reviews</span>
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
                    <span style="font-size: 21px; font-weight: 800; color: #16a34a; letter-spacing: -0.6px;">87%</span>
                    <span style="font-size: 12px; font-weight: 400; color: #9b948a;">retention</span>
                  </div>
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 1px;">
                    <span style="font-size: 21px; font-weight: 800; color: #f97316; letter-spacing: -0.6px;">38</span>
                    <span style="font-size: 12px; font-weight: 400; color: #9b948a;">new cards</span>
                  </div>
                </div>
              </div>
            </div>
            <div style="background: #0b63f6; padding: 13px 14px; display: flex; align-items: center; justify-content: space-between;">

              <span style="font-size: 13px; font-weight: 400; color: #7d766c;">to approve</span>
            </div>
          </div>
          <div style="background: #ffffff; border: 1px solid #e2dbd0; border-radius: 10px; padding: 14px 13px; display: flex; align-items: center; gap: 11px;">

              <span style="font-size: 13px; font-weight: 400; color: #7d766c;">need you</span>
            </div>
          </div>
        </div>

        <!-- book rail -->
        <div style="padding: 26px 20px 0 20px; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 22px; font-weight: 800; color: #17181a; letter-spacing: -0.7px;">Your books</div>

              </div>
              <span style="font-size: 11px; font-weight: 700; color: #16a34a;">62%</span>
            </div>
          </div>
          <div style="width: 118px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;">
            <div style="height: 152px; border-radius: 8px; background: #5b2d5f; padding: 14px 12px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative;">
              <div style="position: absolute; right: -20px; bottom: 30px; width: 64px; height: 64px; border-radius: 32px; background: #7a4180;"></div>
              <span style="font-size: 15px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px; line-height: 19px; position: relative;">30 Agents in 30 Days</span>
              <span style="font-size: 11px; font-weight: 500; color: #d0aad4; position: relative;">83 cards</span>
            </div>
            <div style="display: flex; align-items: center; gap: 5px;">
              <div style="flex-grow: 1; height: 5px; background: #e8e1d6; border-radius: 3px; overflow: hidden; display: flex;">
                <div style="width: 24%; background: #f97316; border-radius: 3px;"></div>
              </div>
              <span style="font-size: 11px; font-weight: 700; color: #f97316;">24%</span>
            </div>
          </div>

            <div style="height: 152px; border-radius: 8px; border: 1.5px dashed #d5cdc0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; box-sizing: border-box;">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#a89f92" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              <span style="font-size: 12px; font-weight: 600; color: #a89f92;">Import</span>

          </div>
        </div>

        <!-- bottom nav -->
        <div style="margin-top: auto; background: #fdf8f0; border-top: 1px solid #e8e1d6; padding: 9px 12px 24px 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; border-radius: 17px; background: #0b63f6; display: flex; align-items: center; justify-content: center;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>

            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9b948a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
            </div>

          </div>
          <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
            <div style="width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; position: relative;">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#9b948a" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>

      </div>
    </div>
  </div>

</div>

[project]
name = "recally"
version = "0.1.0"
description = "Turns O'Reilly reading highlights into scheduled flashcards"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The library the docs call "py-fsrs" (its repo name) publishes as `fsrs` on PyPI.
    "fsrs>=6,<7",
    "litellm>=1.55",
    # APScheduler 4.x is a pre-release with a different API; stay on 3.x (roadmap step 0).
    "apscheduler>=3.10,<4",
    "watchdog>=6",
    "firebase-admin>=7.5.0",
]

# The nightly FSRS fit (scheduling/optimizer.py) needs torch + pandas via the
# library's own extra. Kept optional — ~800MB that no Android or CI job needs
# (docs/architecture.md, "Optimizer"; install: uv sync --extra optimizer).
[project.optional-dependencies]
optimizer = ["fsrs[optimizer]"]

[project.scripts]
recally = "recally.cli:entrypoint"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4",
    # Starlette's TestClient transport (it deprecates plain httpx in favour of this);
    # test-only, so declared here rather than pulled in via fastapi's `standard` extra.
    "httpx2",
    # The Postgres half of the dual-backend suite (roadmap step 7, ADR-016).
    # `pgserver` vendors a real PostgreSQL 16 server binary and runs it on a unix
    # socket in a temp directory, so the suite proves hard rule 4 on an actual
    # Postgres with no system install, no Docker and no CI service container.
    # Test-only: the app never imports it, and the deployed backend talks to a real
    # server through `RECALLY_DATABASE_URL`.
    "pgserver>=0.1.4",
    # The driver SQLAlchemy uses for `postgresql+psycopg://`. The `binary` extra
    # ships libpq, so nothing has to be built or linked against a system Postgres.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recally"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/recally"]
strict = true

# firebase-admin ships no py.typed marker.
[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

# APScheduler 3.x ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Fit tests need torch + pandas; they skip when the extra is absent so the
    # default `uv sync` suite (and CI) stays green and fast.
    "optimizer: needs the fsrs[optimizer] extra (uv sync --extra optimizer)",
    # The dual-backend half of the suite (roadmap step 7). `pgserver` is a dev
    # dependency, so these normally run; the marker exists so a machine where the
    # vendored server cannot start reports skips against one name rather than a
    # scattering of errors.
    "postgres: runs against an embedded PostgreSQL server (pgserver)",
]

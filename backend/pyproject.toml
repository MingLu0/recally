[project]
name = "recally"
version = "0.1.0"
description = "Turns O'Reilly reading highlights into scheduled flashcards"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The library the docs call "py-fsrs" (its repo name) publishes as `fsrs` on PyPI.
    "fsrs>=6,<7",
    "litellm>=1.55",
    # APScheduler 4.x is a pre-release with a different API; stay on 3.x (roadmap step 0).
    "apscheduler>=3.10,<4",
    "watchdog>=6",
]

# The nightly FSRS fit (scheduling/optimizer.py) needs torch + pandas via the
# library's own extra. Kept optional — ~800MB that no Android or CI job needs
# (docs/architecture.md, "Optimizer"; install: uv sync --extra optimizer).
[project.optional-dependencies]
optimizer = ["fsrs[optimizer]"]

[project.scripts]
recally = "recally.cli:entrypoint"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pre-commit>=4",
    # Starlette's TestClient transport (it deprecates plain httpx in favour of this);
    # test-only, so declared here rather than pulled in via fastapi's `standard` extra.
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recally"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/recally"]
strict = true

# APScheduler 3.x ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    # Fit tests need torch + pandas; they skip when the extra is absent so the
    # default `uv sync` suite (and CI) stays green and fast.
    "optimizer: needs the fsrs[optimizer] extra (uv sync --extra optimizer)",
]

# Alembic configuration. Run from `backend/`: `uv run alembic upgrade head`.
#
# There is deliberately no `sqlalchemy.url` here. The URL comes from
# `RECALLY_DATABASE_URL` through `recally.config` in env.py, so the migrations and the
# app cannot end up pointed at different databases, and no connection string with a
# password in it is ever committed. To point a single invocation somewhere else, set
# `RECALLY_DATABASE_URL` in the environment, or set `sqlalchemy.url` on a programmatic
# Config, which env.py leaves alone when it is already set (see tests/test_migrations.py).

[alembic]
script_location = %(here)s/alembic

# Migration filenames are date-prefixed so `ls versions/` reads in apply order; the
# revision hash still decides the actual ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# `src` layout: makes `recally` importable when alembic runs from `backend/`.
prepend_sys_path = src
path_separator = os

# Stored timestamps are UTC everywhere in this project (see models/base.py).
timezone = UTC

[post_write_hooks]
# Autogenerated migrations are linted and formatted the same way as hand-written code,
# so a new migration does not arrive failing CI. Lint first: --fix rewrites imports,
# and the formatter then settles the layout.
hooks = ruff_lint,ruff_format
ruff_lint.type = exec
ruff_lint.executable = ruff
ruff_lint.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
